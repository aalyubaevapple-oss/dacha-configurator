<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#efebe4" />
    <meta name="description" content="Соберите дачный домик в 3D и сразу узнайте предварительную стоимость." />
    <title>Конфигуратор дачного домика</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 15 16 5l12 10v12H4z' fill='%232f5d46'/%3E%3C/svg%3E" />
    <script type="module" crossorigin src="./assets/index-BzQgVNyH.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CE2rLWNR.css">
  </head>
  <body>
    <div class="app" id="app">
      <main class="viewer" id="viewer" aria-label="3D-модель домика">
        <div class="viewer-top">
          <div class="brand">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 32 32"><path d="M4 15 16 5l12 10v12H4z" /></svg>
            </span>
            <span class="brand-name" data-bind="brand"></span>
            <span class="badge" data-bind="badge"></span>
          </div>
          <div class="dims-chip" id="dimsChip"></div>
        </div>

        <div class="hint" id="hint">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V10m0-1.5a1.5 1.5 0 0 1 3 0V11m0-1a1.5 1.5 0 0 1 3 0v4.5a6 6 0 0 1-6 6h-1a6 6 0 0 1-4.6-2.2L4.2 15a1.5 1.5 0 0 1 2.3-1.9L9 15.5" /></svg>
          <span>Покрутите домик, чтобы рассмотреть</span>
        </div>

        <div class="view-tools">
          <button class="tool" id="zoomIn" type="button" aria-label="Приблизить">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
          </button>
          <button class="tool" id="zoomOut" type="button" aria-label="Отдалить">
            <svg viewBox="0 0 24 24"><path d="M5 12h14" /></svg>
          </button>
          <button class="tool" id="resetView" type="button" aria-label="Исходный ракурс">
            <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4" /></svg>
          </button>
        </div>

        <div class="loader" id="loader"><span></span>Строим домик…</div>
      </main>

      <aside class="panel">
        <div class="panel-scroll">
          <header class="panel-head">
            <h1 data-bind="title"></h1>
            <p data-bind="subtitle"></p>
          </header>

          <section class="group" aria-labelledby="g-size">
            <h2 id="g-size">Размеры</h2>
            <div id="dimensions"></div>
          </section>

          <section class="group" aria-labelledby="g-wall">
            <div class="group-title">
              <h2 id="g-wall">Цвет стен</h2>
              <span class="picked" id="wallPicked"></span>
            </div>
            <div class="swatches" id="wallColors" role="radiogroup" aria-labelledby="g-wall"></div>
          </section>

          <section class="group" aria-labelledby="g-roof">
            <div class="group-title">
              <h2 id="g-roof">Цвет кровли</h2>
              <span class="picked" id="roofPicked"></span>
            </div>
            <div class="swatches" id="roofColors" role="radiogroup" aria-labelledby="g-roof"></div>
          </section>

          <section class="group included" aria-labelledby="g-inc">
            <h2 id="g-inc">Пример комплектации</h2>
            <ul id="included"></ul>
          </section>
        </div>

        <footer class="price" id="price">
          <div class="price-row">
            <div>
              <div class="price-label">Предварительная стоимость</div>
              <div class="price-value" id="priceValue">—</div>
            </div>
            <button class="breakdown-btn" id="breakdownBtn" type="button" aria-expanded="false" aria-controls="breakdown">
              Из чего цена
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6" /></svg>
            </button>
          </div>
          <ul class="breakdown" id="breakdown" hidden></ul>
          <p class="price-note">Расчёт предварительный. Итоговая стоимость уточняется у производителя.</p>
        </footer>
      </aside>
    </div>
  </body>
</html>
